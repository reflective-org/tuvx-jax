[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tuvx-jax"
version = "0.1.0"
description = "Python/JAX port of NCAR's TUV-x actinic-flux and photolysis-rate pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",   # validation plots
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tuvx_photolysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
